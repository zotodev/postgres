name: zoto

services:

  db:
    image: postgres:18.6-alpine
    container_name: ${PROJECT_NAME}-db
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        (
          U=$$(printenv POSTGRES_USER)
          P=$$(printenv POSTGRES_PASSWORD)
          D=$$(printenv POSTGRES_DB)
          until pg_isready -h /var/run/postgresql -U "$$U" -q 2>/dev/null; do sleep 1; done
          if psql -h /var/run/postgresql -U "$$U" -d postgres -c 'select 1' >/dev/null 2>&1; then
            AUTH_USER=$$U
          else
            AUTH_USER=postgres
          fi
          psql -h /var/run/postgresql -U "$$AUTH_USER" -d postgres -v ON_ERROR_STOP=0 -v u="$$U" -v p="$$P" -v d="$$D" <<'SQL'
        SELECT format('CREATE ROLE %I WITH LOGIN SUPERUSER', 'postgres')
        WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'postgres')\gexec
        SELECT format('CREATE ROLE %I WITH LOGIN PASSWORD %L SUPERUSER CREATEDB CREATEROLE', :'u', :'p')
        WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'u')\gexec
        SELECT format('CREATE DATABASE %I OWNER %I', :'d', :'u')
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'d')\gexec
        SQL
          echo "ensure-role: done"
        ) &
        exec docker-entrypoint.sh postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PROJECT_NAME: ${PROJECT_NAME}
    expose:
      - "${POSTGRES_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

volumes:
  postgres_data:
