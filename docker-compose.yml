name: zoto

services:

  db:
    image: postgres:18.6-alpine
    container_name: ${PROJECT_NAME}-db
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        (
          until pg_isready -h /var/run/postgresql -q 2>/dev/null; do sleep 1; done
          U=$$(printenv POSTGRES_USER)
          P=$$(printenv POSTGRES_PASSWORD)
          D=$$(printenv POSTGRES_DB)
          if psql -h /var/run/postgresql -U postgres -d postgres -c 'select 1' >/dev/null 2>&1; then
            AUTH_USER=postgres
          else
            AUTH_USER=$$U
          fi
          q=$$(psql -h /var/run/postgresql -U "$$AUTH_USER" -d postgres -tAqc "SELECT format('CREATE ROLE %I WITH LOGIN SUPERUSER', 'postgres') WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'postgres')")
          [ -n "$$q" ] && psql -h /var/run/postgresql -U "$$AUTH_USER" -d postgres -c "$$q"
          q=$$(psql -h /var/run/postgresql -U "$$AUTH_USER" -d postgres -v u="$$U" -v p="$$P" -tAqc "SELECT format('CREATE ROLE %I WITH LOGIN PASSWORD %L SUPERUSER CREATEDB CREATEROLE', :'u', :'p') WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'u')")
          [ -n "$$q" ] && psql -h /var/run/postgresql -U "$$AUTH_USER" -d postgres -c "$$q"
          q=$$(psql -h /var/run/postgresql -U "$$AUTH_USER" -d postgres -v u="$$U" -v d="$$D" -tAqc "SELECT format('CREATE DATABASE %I OWNER %I', :'d', :'u') WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'d')")
          [ -n "$$q" ] && psql -h /var/run/postgresql -U "$$AUTH_USER" -d postgres -c "$$q"
          echo "ensure-role: done"
        ) &
        exec docker-entrypoint.sh postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    expose:
      - "${POSTGRES_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

volumes:
  postgres_data:
