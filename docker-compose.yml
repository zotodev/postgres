name: zoto

services:

  db:
    image: postgres:18.6-alpine
    container_name: ${PROJECT_NAME}-db
    entrypoint: ["/entrypoint-wrapper.sh"]
    command: ["postgres"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PROJECT_NAME: ${PROJECT_NAME}
    expose:
      - "${POSTGRES_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/entrypoint-wrapper.sh:/entrypoint-wrapper.sh:ro
      - ./init-scripts/00-ensure-fallback-superuser.sh:/docker-entrypoint-initdb.d/00-ensure-fallback-superuser.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
